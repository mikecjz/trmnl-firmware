; Standalone panel-controller probe for the Xteink X4 Classic (X4 v2).
;
; Flashed app-only at 0x10000 (stock bootloader / partition table / NVS stay in
; place). It powers the panel rail, resets the panel, issues 0x70 and clocks
; three bytes back half-duplex on MOSI. It never initialises the panel, writes
; a LUT/waveform, or touches the framebuffer.
[env:x4c_probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
upload_speed = 460800
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINOJSON_ENABLE_ARDUINO_STRING=1
	-D BOARD_XTEINK_X4_CLASSIC
